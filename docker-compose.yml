version: "3"

# -----------------------------------------------------------------------------
# Olist Big Data Frameworks platform
# -----------------------------------------------------------------------------
# Hadoop (namenode + datanode + resourcemanager + nodemanager + history) +
# Spark Standalone (master + 2 workers) + Hive (server + metastore + postgres) +
# Presto + Postgres datamart + FastAPI + Streamlit.
#
# Volumes:
#   ./source     -> /source       (Olist CSVs available to spark-master/workers)
#   ./pipeline   -> /opt/pipeline (feeder.py / processor.py / datamart.py + logs)
#   ./jars       -> /opt/jars     (postgresql JDBC driver for datamart.py)
#
# Authors: Adam Beloucif, Emilien Morice (M1 DE&IA - EFREI - 2026)
# -----------------------------------------------------------------------------

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - 9870:9870
      - 9010:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    env_file:
      - ./hadoop.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "9864:9864"
    env_file:
      - ./hadoop.env

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    ports:
      - "8088:8088"
    env_file:
      - ./hadoop.env

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    env_file:
      - ./hadoop.env

  spark-master:
    image: bde2020/spark-master:3.0.0-hadoop3.2
    container_name: spark-master
    depends_on:
      - namenode
      - datanode
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./source:/source
      - ./pipeline:/opt/pipeline
      - ./jars:/opt/jars

  spark-worker-1:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1g
    volumes:
      - ./source:/source
      - ./pipeline:/opt/pipeline
      - ./jars:/opt/jars

  spark-worker-2:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1g
    volumes:
      - ./source:/source
      - ./pipeline:/opt/pipeline
      - ./jars:/opt/jars

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    depends_on:
      - namenode
      - datanode
    env_file:
      - ./hadoop-hive.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./hadoop-hive.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    ports:
      - "5432:5432"

  presto-coordinator:
    image: shawnzhu/prestodb:0.181
    container_name: presto-coordinator
    ports:
      - "8089:8089"

  # -------------------------------------------------------------------------
  # Datamart layer (gold) + applications
  # -------------------------------------------------------------------------
  postgres-datamart:
    image: postgres:16-alpine
    container_name: postgres-datamart
    restart: always
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist_dm
    ports:
      - "5433:5432"
    volumes:
      - postgres_datamart:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: olist-api
    depends_on:
      - postgres-datamart
    environment:
      OLIST_DATABASE_URL: postgresql+psycopg2://olist:olist@postgres-datamart:5432/olist_dm
      OLIST_JWT_SECRET: olist-bdf-2026-secret-change-me
    ports:
      - "8000:8000"

  viz:
    image: python:3.11-slim
    container_name: olist-viz
    depends_on:
      - postgres-datamart
    working_dir: /app
    volumes:
      - ./viz:/app
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    environment:
      OLIST_DATABASE_URL: postgresql+psycopg2://olist:olist@postgres-datamart:5432/olist_dm
    ports:
      - "8501:8501"

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_historyserver:
  postgres_datamart:
